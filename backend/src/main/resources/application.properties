spring.application.name=ctf
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5433/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=60
app.flag.secret=${FLAG_SECRET}

app.docker.bind=127.0.0.1
app.docker.network=ctf-challenges
app.docker.public-host=localhost
app.instance.ttl-minutes=30
